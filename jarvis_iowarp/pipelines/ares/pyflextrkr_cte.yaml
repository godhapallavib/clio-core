# PyFLEXTRKR cloud tracking + CTE via HDF5 VOL connector (Ares cluster)
#
# Usage:
#   jarvis hostfile set ~/hostfile_local.txt
#   jarvis ppl build yaml ~/clio-core/jarvis_iowarp/pipelines/ares/pyflextrkr_cte.yaml
#   jarvis ppl run yaml ~/clio-core/jarvis_iowarp/pipelines/ares/pyflextrkr_cte.yaml

name: pyflextrkr_cte

install_manager: container
container_engine: docker
container_base: ubuntu:24.04

env:
  OMPI_MCA_btl_tcp_if_include: enp47s0np0

pkgs:
  - pkg_type: builtin.hdf5
    deploy_mode: container

  - pkg_type: builtin.adios2
    deploy_mode: container

  - pkg_type: jarvis_iowarp.wrp_runtime
    deploy_mode: container
    git_branch: transparent-compress
    cmake_preset: release-adapter

  - pkg_type: jarvis_iowarp.wrp_cte
    deploy_mode: container

  - pkg_type: jarvis_iowarp.wrp_adapters
    deploy_mode: container
    vol: true
    include: [".*"]

  - pkg_type: builtin.pyflextrkr
    deploy_mode: container
    demo: mcs_tbpf
    nprocs: 1
    ppn: 1
